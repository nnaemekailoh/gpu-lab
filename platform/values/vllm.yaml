# values-stage1.yaml

routerSpec:
  enableRouter: true
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      memory: "4Gi"          
  startupProbe:
    httpGet: {path: "/health", port: 8000}
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 30      

servingEngineSpec:                  # defines the vLLM engine pods
  enableEngine: true
  runtimeClassName: ""              # nvidia container runtime; "" to disable
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"
  modelSpec:                        # a LIST - one entry per model deployment
  - name: "opt125m"                 # k8s-safe short name, used in pod and service names
    repository: "vllm/vllm-openai"  # official vLLM OpenAI server image
    tag: "latest"                   # pin a real version in production
    modelURL: "facebook/opt-125m"   # HF model id, or a local path (stage 2)
    replicaCount: 1
    requestCPU: 6
    requestMemory: "16Gi"           # must hold the weights during load
    requestGPU: 1                   # whole GPUs; fractional (0.5) works for tests
    vllmConfig:
      maxModelLen: 2048             # --max-model-len; context window
      gpuMemoryUtilization: 0.6     # --gpu-memory-utilization; VRAM fraction for weights + KV