# 16GB VRAM. Qwen2.5-3B bf16 is ~6.2GB, leaving room for KV cache.
# 7B bf16 is ~15GB and will not leave enough.
servingEngineSpec:
  runtimeClassName: ""
  modelSpec:
    - name: "qwen"
      repository: "vllm/vllm-openai"
      tag: "v0.5.4"
      modelURL: "Qwen/Qwen2.5-1.5B-Instruct"
      replicaCount: 1

      requestCPU: 4
      requestMemory: "16Gi"
      requestGPU: 1

      pvcStorage: "50Gi"
      pvcAccessMode:
        - ReadWriteOnce

      vllmConfig:
        maxModelLen: 8192
        dtype: "bfloat16"
        extraArgs:
          - "--gpu-memory-utilization"
          - "0.90"
          - "--otlp-traces-endpoint"
          - "http://otel-collector-opentelemetry-collector.monitoring.svc:4317"

      # required when requestGPU > 1
      # shmSize: "8Gi"

      # MoE models only. Balancedness is logged, not exported.
      # extraArgs additions:
      #   --enable-expert-parallel
      #   --enable-eplb
      #   --eplb-config '{"window_size":1000,"step_interval":3000,"num_redundant_experts":2,"log_balancedness":true}'

  serviceMonitor:
    enabled: true

routerSpec:
  serviceMonitor:
    enabled: true

kube-prometheus-stack:
  enabled: false

grafanaDashboards:
  enabled: true
