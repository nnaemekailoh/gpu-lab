# subcharts off: ollama would be a second inference engine on the same GPU
ollama:
  enabled: false
pipelines:
  enabled: false
tika:
  enabled: false
redis:
  enabled: false

enableOpenaiApi: true
openaiBaseApiUrl: "http://vllm-router-service.serving.svc:80/v1"
openaiApiKey: "not-required"

persistence:
  enabled: true
  size: 5Gi

ingress:
  enabled: true
  class: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"

extraEnvVars:
  - name: WEBUI_AUTH
    value: "False"

resources:
  requests:
    cpu: 100m
    memory: 512Mi
